# Self-hosted deployment build only; this branch is never proposed upstream.
name: self-arm64-image

on:
  push:
    branches:
      - 'self-build/**'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        run: |
          # Ignore workflow-only commits when identifying the image source.
          source_sha=$(git log -1 --format=%H -- . ':!.github/workflows/self-arm64-image.yml')
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=8 "$source_sha")" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/arm64 image
        run: |
          git checkout --detach "${{ steps.meta.outputs.source_sha }}"
          docker buildx build \
            --platform linux/arm64 \
            --file deploy/Dockerfile \
            --target runtime \
            --build-arg CPR_GIT_SHA="${{ steps.meta.outputs.source_sha }}" \
            --build-arg CPR_BUILD_TIME="${{ steps.meta.outputs.build_time }}" \
            --tag "codex-proxy-rs-local:3.16.0-guardian.${{ steps.meta.outputs.short_sha }}" \
            --output type=docker,dest=image.tar \
            .
          gzip -1 image.tar
          sha256sum image.tar.gz | tee image.tar.gz.sha256
      - name: Store image on VPS
        env:
          VPS_ARTIFACT_TOKEN: ${{ secrets.VPS_ARTIFACT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VPS_ARTIFACT_TOKEN"
          zip -0 image.zip image.tar.gz image.tar.gz.sha256
          artifact="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 240 \
            --retry 3 --retry-delay 5 \
            --header "Authorization: Bearer $VPS_ARTIFACT_TOKEN" \
            --upload-file image.zip \
            "https://vps.cangming.fyi/ci-upload/cpr/$artifact"
          echo "[Download image (workbench login required)](https://desk.vps.cangming.fyi/ci-artifacts/cpr/$artifact) — latest 3 builds, up to 7 days." >> "$GITHUB_STEP_SUMMARY"
